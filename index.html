<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>員工快速打卡系統</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 引入獨立自訂樣式檔 -->
  <link rel="stylesheet" href="style.css?V=261123152503">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-blue-100">

  <!-- 主卡片容器 -->
  <main class="w-full max-w-sm bg-white rounded-3xl shadow-xl shadow-slate-200/80 border border-slate-100 overflow-hidden">
    
    <!-- 頂部品牌識別橫幅 -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-6 text-white text-center relative">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-sm mb-3 shadow-inner">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-wide">公司員工出勤打卡</h1>
      <p id="liveClock" class="text-xs text-blue-100 mt-1 font-mono tracking-wider">--:--:--</p>
    </div>

    <!-- 卡片內容區 -->
    <div class="p-6">
      
      <!-- 員工身分膠囊標籤 -->
      <div class="flex justify-center mb-5">
        <span id="userBadge" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-semibold bg-slate-100 text-slate-700 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          讀取 LINE 身分中...
        </span>
      </div>

      <!-- 首次使用姓名綁定區塊 -->
      <div id="bindSection" class="hidden mb-5 bg-rose-50/70 border border-rose-100 rounded-2xl p-4">
        <label for="empName" class="block text-xs font-bold text-rose-600 mb-2">
          首次使用，請選擇你的姓名進行永久綁定：
        </label>
        <div class="relative">
          <select id="empName" class="w-full appearance-none bg-white border border-rose-200 text-slate-800 text-base font-medium rounded-xl px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            <option value="">-- 請選擇你的姓名 --</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <!-- 動態狀態提示框 -->
      <div id="statusBox" class="status-card status-loading rounded-2xl p-4 mb-5 text-sm font-medium leading-relaxed flex items-start gap-3">
        <div id="statusIcon" class="mt-0.5 shrink-0">
          <div class="spinner"></div>
        </div>
        <div id="statusText" class="whitespace-pre-line text-left">正在初始化系統與定位...</div>
      </div>

      <!-- 手動打卡操作按鈕群組 -->
      <div id="manualBtns" class="hidden grid-cols-2 gap-3">
        <button id="btnIn" onclick="executePunch('上班')" class="btn-press col-span-1 py-4 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-base shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
          <span>上班打卡</span>
        </button>

        <button id="btnOut" onclick="executePunch('下班')" class="btn-press col-span-1 py-4 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          <span>下班打卡</span>
        </button>
      </div>

    </div>

    <!-- 底部版本號區 -->
    <footer class="bg-slate-50 border-t border-slate-100 px-6 py-3 text-center">
      <p id="versionFooter" class="text-[11px] font-mono text-slate-400 tracking-wider">Version Loading...</p>
    </footer>

  </main>

  <!-- 引入獨立邏輯程式檔 -->
  <script src="app.js?V=261123152503"></script>
</body>
</html>
